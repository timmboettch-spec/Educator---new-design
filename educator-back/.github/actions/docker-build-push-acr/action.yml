name: "docker-build-push-acr"
description: >-
  Builds a Docker image and pushes multiple tags to an already-authenticated
  ACR. Does NOT handle auth — assumes `az acr login` or `docker login`
  already ran in a prior step (typically via azure-oidc-login +
  acr-resolve-login-server). Wraps the official `docker/setup-buildx-action`
  + `docker/build-push-action` (the same actions HS-online-AI-app's original
  deploy-app.yml used directly) instead of reimplementing `docker buildx
  build` — only the tag-list/build-arg glue that those actions don't provide
  is custom script.

# ─────────────────────────────────────────────────────────────────────────────
# Example usage (after ACR auth has already happened):
#
#   - name: Build and push backend image
#     id: build
#     uses: ./.github/actions/docker-build-push-acr
#     with:
#       context:     ./backend
#       dockerfile:  ./backend/Dockerfile
#       registry:    acrall1rwai.azurecr.io
#       image-name:  hsbackimage
#       tags: |
#         v1
#         ${{ github.sha }}
#       build-args: |
#         NODE_ENV=production
#
#   - run: echo "Pushed ${{ steps.build.outputs.image-ref }}"
#
# Cross-repo note: reusable workflows in this repo reference this action by
# full path (not "./"), since local paths resolve against the calling repo:
#   uses: Realityworks-AI/Global-Standards-Policy/.github/actions/docker-build-push-acr@main
# ─────────────────────────────────────────────────────────────────────────────

inputs:
  context:
    description: 'Docker build context, e.g. ./backend'
    required: true
  dockerfile:
    description: 'Full path to the Dockerfile, e.g. ./backend/Dockerfile'
    required: true
  registry:
    description: 'ACR login server FQDN, e.g. acrall1rwai.azurecr.io'
    required: true
  image-name:
    description: 'Image repository name, e.g. hsbackimage'
    required: true
  tags:
    description: 'Newline-separated list of tag values, e.g. v1\nabc1234'
    required: true
  build-args:
    description: "Newline-separated KEY=VALUE build-arg pairs"
    required: false
    default: ''
  push:
    description: "'true' to push, 'false' to --load locally only"
    required: false
    default: 'true'

outputs:
  image-ref:
    description: 'The first fully-qualified registry/image-name:tag reference built'
    value: ${{ steps.prep.outputs.image-ref }}
  all-tags:
    description: 'Comma-separated list of all fully-qualified refs built/pushed'
    value: ${{ steps.prep.outputs.all-tags }}

runs:
  using: composite
  steps:
    # Only the tag-list/build-arg transform is custom script — there's no
    # existing action for "turn a newline list of tag values into fully
    # qualified refs", so this is the "scripts only where needed" piece.
    # Runs on `shell: bash`, which GitHub-hosted windows-latest runners ship
    # (Git Bash) alongside ubuntu-latest/macos-latest, so one script covers
    # every OS without a separate PowerShell copy of pure string plumbing.
    - name: Compute tag refs and build-arg list
      id: prep
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_NAME: ${{ inputs.image-name }}
        TAGS: ${{ inputs.tags }}
      run: ${{ github.action_path }}/scripts/docker-build-push-acr-prep.sh

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.push != 'true' }}
        tags: ${{ steps.prep.outputs.tags-multiline }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
