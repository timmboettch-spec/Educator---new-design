name: "deploy-swa"
description: >-
  Aggregated Azure Static Web Apps deploy: uploads an already-built `dist/`
  to the given SWA deployment token, optionally to a named preview
  environment. Used by both deploy-frontend.yml (real environments, no
  deployment-environment set) and preview-deploy.yml (branch previews, named
  deployment-environment) so the deploy step can't drift between the two
  pipelines. Pins Azure/static-web-apps-deploy to a commit SHA per org
  security policy — "v1" also exists as an old, frozen 2021 *tag*, so "@v1"
  is not a stable reference.

inputs:
  api-token:
    description: 'Azure Static Web Apps deployment token for the target SWA.'
    required: true
  app-location:
    description: 'Path to the built app output (already built — this action does not build). Ignored when action = close.'
    required: false
    default: 'dist'
  deployment-environment:
    description: 'Named preview environment. Empty deploys to / closes the production (default) slot.'
    required: false
    default: ''
  action:
    description: "'upload' to deploy, 'close' to tear down a preview environment."
    required: false
    default: 'upload'

outputs:
  url:
    description: 'Deployed Static Web App URL (empty for action = close).'
    value: ${{ steps.deploy.outputs.static_web_app_url }}

runs:
  using: composite
  steps:
    - name: Deploy to Azure Static Web Apps
      id: deploy
      uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch HEAD as of 2024-09-11
      with:
        azure_static_web_apps_api_token: ${{ inputs.api-token }}
        action: ${{ inputs.action }}
        app_location: ${{ inputs.app-location }}
        output_location: ''
        skip_app_build: true
        deployment_environment: ${{ inputs.deployment-environment }}
